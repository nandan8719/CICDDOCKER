name: Azure CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build Docker Image
      run: |
        docker build -t myapp ./app

    - name: Login to ACR
      run: |
        az acr login --name <your-acr-name>

    - name: Tag Image
      run: |
        docker tag myapp <your-acr-name>.azurecr.io/myapp:latest

    - name: Push Image
      run: |
        docker push <your-acr-name>.azurecr.io/myapp:latest

    - name: Terraform Init & Apply
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve